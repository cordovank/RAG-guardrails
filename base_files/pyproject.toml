[project]
name = "rag-ai"
version = "0.1.0"
description = "RAG / LLM services"
requires-python = ">=3.10,<3.11"

dependencies = [
  # --- Core API runtime ---
  "fastapi==0.118.2",
  "starlette==0.48.0",
  "uvicorn==0.37.0",
  "gunicorn==23.0.0",

  # --- Async / HTTP ---
  "anyio==4.11.0",
  "httpx==0.28.1",
  "httpx-sse==0.4.2",
  "aiohttp==3.13.0",

  # --- Serialization / Validation ---
  "pydantic==2.12.0",
  "pydantic-settings==2.11.0",
  "orjson==3.11.3",
  "PyYAML==6.0.3",

  # --- LLM / RAG ---
  "openai==1.109.1",
  "tiktoken==0.12.0",
  "langchain-core==0.3.78",
  "langchain-community==0.3.31",
  "langchain-openai==0.3.35",
  "langchain-text-splitters==0.3.11",

  # --- Embeddings / ML ---
  "numpy==1.26.4",
  "scikit-learn==1.4.2",
  "torch==2.8.0",
  "faiss-cpu==1.8.0",
  "sentence-transformers==5.1.1",
  "transformers==4.57.0",
  "tokenizers==0.22.1",
  "safetensors==0.6.2",

  # --- Data / Document handling ---
  "pandas==2.2.3",
  "datasets==4.1.1",
  "pyarrow==21.0.0",
  "lxml==5.3.0",
  "trafilatura==2.0.0",
  "justext==3.0.2",
  "courlan==1.3.2",
  "htmldate==1.9.3",
  "dateparser==1.2.2",
  "rank-bm25==0.2.2",
  "regex==2025.9.18",

  # --- Observability (minimal) ---
  "opentelemetry-api==1.37.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
